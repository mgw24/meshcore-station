name: MeshCore Station tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python and browser logic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Python tests
        run: PYTHONPATH=. pytest -q
      - name: JavaScript tests
        run: |
          node --check static/app.js
          for f in tests/*.cjs; do node "$f"; done
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Docker Compose configuration (placeholder secrets only)
        env:
          BIND_IP: 127.0.0.1
          POSTGRES_USER: meshcore
          POSTGRES_DB: meshcore
          POSTGRES_PASSWORD: test-only-not-a-secret
          GRAFANA_DB_PASSWORD: test-only-not-a-secret
          GRAFANA_ADMIN_PASSWORD: test-only-not-a-secret
          RADIO_DEVICE: /dev/ttyACM0
        run: docker compose -f compose.yaml config --quiet
