x-logging: &limited-logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
name: meshcore-station
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-grafana.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [inside]
  api:
    build: .
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "${BIND_IP}:${APP_PORT:-8088}:8000"
    volumes:
      - ./runtime/spool:/spool
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [inside]
  collector:
    build: .
    command: ["python", "-m", "station.worker"]
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      api: {condition: service_healthy}
    devices:
      - "${RADIO_DEVICE}:/dev/meshcore"
    group_add: [dialout]
    networks: [inside]
  digest:
    build: .
    command: ["python", "-m", "station.digest_worker"]
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: {condition: service_healthy}
    # Digest service uses database + SMTP; it does NOT access the serial device.
    networks: [inside]
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    logging: *limited-logs
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://${BIND_IP}:${GRAFANA_PORT:-3300}/"
      PGHOST: db
      PGUSER: grafana_reader
      PGPASSWORD: ${GRAFANA_DB_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "${BIND_IP}:${GRAFANA_PORT:-3300}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [inside]
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    logging: *limited-logs
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    depends_on: [api]
    networks: [inside]
volumes:
  pgdata:
  grafanadata:
  prometheusdata:
networks:
  inside: {}
